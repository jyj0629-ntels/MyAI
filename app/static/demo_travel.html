<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTrip Agent (/demo_travel)</title>
  <style>
    :root {
      --bg: #09111f; --panel: rgba(14, 24, 40, 0.92); --panel-soft: #13233c;
      --border: rgba(148, 163, 184, 0.18); --primary: #6ee7f9; --primary-2: #9a7bff;
      --green: #6ee7b7; --amber: #fbbf24; --text: #edf6ff; --muted: #9bb1c7; --danger: #f87171;
      --shadow: 0 20px 60px rgba(9, 17, 31, 0.6);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(110, 231, 249, 0.20), transparent 25%),
        radial-gradient(circle at bottom right, rgba(154, 123, 255, 0.18), transparent 30%),
        var(--bg);
      color: var(--text);
    }
    .topbar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(18px);
      background: rgba(9, 17, 31, 0.78); border-bottom: 1px solid var(--border); }
    .topbar-inner { max-width: 1440px; margin: 0 auto; padding: 16px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
    .brand-name { font-size: 1.05rem; }
    .pill { border: 1px solid var(--border); background: rgba(148,163,184,0.08);
      color: var(--text); border-radius: 999px; padding: 8px 14px; font-size: 0.85rem; text-decoration: none; }

    .main { max-width: 1440px; width: 100%; margin: 0 auto; padding: 28px; }
    .layout { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--border);
      border-radius: 22px; box-shadow: var(--shadow); padding: 22px; }
    .panel h3 { margin: 0 0 14px; font-size: 1.05rem; }
    .muted { color: var(--muted); }

    label.field-label { display: block; font-size: 0.85rem; color: var(--muted); margin: 14px 0 6px; }
    textarea, select { width: 100%; background: var(--panel-soft); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 1rem; font-family: inherit; }
    textarea { min-height: 110px; resize: vertical; }
    .checks { display: flex; flex-wrap: wrap; gap: 10px; }
    .check { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: 999px; background: rgba(148,163,184,0.06); cursor: pointer; font-size: 0.9rem; }
    .check input { accent-color: var(--primary); }
    .btn { margin-top: 18px; width: 100%; cursor: pointer; border: none; border-radius: 14px;
      padding: 13px 16px; font-size: 1rem; font-weight: 700; color: #04121d;
      background: linear-gradient(135deg, var(--primary), var(--primary-2)); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .status-line { margin-top: 12px; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
    .spinner { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
      border: 2px solid rgba(110,231,249,0.35); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .final-box { border: 1px solid rgba(110, 231, 249, 0.32); box-shadow: inset 0 0 0 1px rgba(110, 231, 249, 0.12);
      border-radius: 16px; padding: 18px; background: rgba(110,231,249,0.05); white-space: pre-wrap; line-height: 1.7; font-size: 1.05rem; }

    .section-title { margin: 22px 0 8px; font-size: 0.95rem; color: var(--muted); }
    details { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: rgba(148,163,184,0.05); }
    details > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; }
    .round-note { padding: 0 14px 12px; color: var(--muted); font-size: 0.85rem; white-space: pre-wrap; }
    .response-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; padding: 0 14px 14px; }
    .provider-box { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: rgba(148,163,184,0.06); }
    .provider-label { font-weight: 700; margin-bottom: 8px; }
    .provider-text { white-space: pre-wrap; line-height: 1.6; font-size: 0.92rem; }

    .history-item { padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 10px; cursor: pointer; background: rgba(148,163,184,0.05); }
    .history-item:hover { background: rgba(110,231,249,0.08); }
    .history-q { font-size: 0.92rem; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-meta { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a href="/home" title="홈으로" style="display:inline-flex;">
          <img src="/static/images/home_logo.png" alt="홈" style="width:38px;height:38px;border-radius:12px;display:block;" />
        </a>
        <div class="brand-name">MyTrip Agent</div>
      </div>
      <div class="top-actions">
        <a class="pill" href="/home">← 홈</a>
        <span class="pill" id="connState">준비됨</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="layout">
      <div>
        <div class="panel">
          <h3>여행 정보 입력</h3>
          <label class="field-label">여행 국가</label>
          <textarea id="country" style="min-height:40px;" placeholder="예: 태국"></textarea>
          <label class="field-label">여행 지역</label>
          <textarea id="region" style="min-height:40px;" placeholder="예: 치앙마이"></textarea>
          <label class="field-label">여행 기간</label>
          <textarea id="period" style="min-height:40px;" placeholder="예: 10월3일 ~ 10월11일"></textarea>
          <label class="field-label">핵심 관광지</label>
          <textarea id="mustSee" style="min-height:40px;" placeholder="예: 치앙마이 그랜드 캐년"></textarea>
          <label class="field-label">여행기간 특이사항</label>
          <textarea id="periodNotes" placeholder="예: 10/3 인천→치앙마이 도착, 10/10 아침 기차로 돈므앙 이동, 10/11 돈므앙→인천"></textarea>
          <label class="field-label">비고사항 (렌터카/이동 등)</label>
          <textarea id="remarks" placeholder="예: 국제면허 보유, 경차 저렴한 렌터카, 도착일은 Grab 이용, 기차역에서 렌터카 반납"></textarea>

          <label class="field-label">비교 대상 Public AI</label>
          <div class="checks">
            <label class="check"><input type="checkbox" value="gemini" checked /> Gemini</label>
            <label class="check"><input type="checkbox" value="groq" checked /> Groq</label>
            <label class="check"><input type="checkbox" value="mistral" checked /> Mistral</label>
          </div>

          <label class="field-label">Local LLM 취합 모델</label>
          <select id="llmModel">
            <option value="">서버 기본값 사용</option>
            <option value="qwen3:4b">qwen3:4b</option>
            <option value="qwen3:8b">qwen3:8b</option>
            <option value="qwen3:14b">qwen3:14b</option>
          </select>

          <button class="btn" id="runBtn">Step1·Step2 실행</button>
          <div class="status-line" id="statusLine"></div>
        </div>

        <div class="panel" style="margin-top:20px;">
          <h3>이력</h3>
          <div id="historyList"><div class="muted">불러오는 중...</div></div>
        </div>
      </div>

      <div class="panel">
        <h3>최종 안내 <span class="muted" id="finalModel"></span></h3>
        <div class="final-box" id="finalBox">여행 정보를 입력하고 [Step1·Step2 실행]을 누르세요. (개인 성향이 자동 반영됩니다)</div>

        <div class="section-title">단계별 상세</div>
        <div id="rounds"></div>
      </div>
    </div>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const runBtn = el('runBtn'), statusLine = el('statusLine'), finalBox = el('finalBox');
    const finalModel = el('finalModel'), rounds = el('rounds'), historyList = el('historyList');

    function selectedProviders() {
      return Array.from(document.querySelectorAll('.checks input:checked')).map((c) => c.value);
    }
    function setBusy(busy, msg) {
      runBtn.disabled = busy;
      statusLine.innerHTML = busy ? `<span class="spinner"></span>${msg || '처리 중...'}` : (msg || '');
    }

    function roundBlock(title, items, note) {
      const wrap = document.createElement('details');
      const sum = document.createElement('summary');
      sum.textContent = title;
      wrap.appendChild(sum);
      if (note) {
        const n = document.createElement('div');
        n.className = 'round-note';
        n.textContent = 'STEP2 일정 프롬프트(Ollama가 STEP1 취합해 자동 생성):\n' + note;
        wrap.appendChild(n);
      }
      const grid = document.createElement('div');
      grid.className = 'response-grid';
      if (!items || !items.length) {
        grid.innerHTML = '<div class="muted" style="padding:0 0 14px;">응답 없음</div>';
      } else {
        items.forEach((r) => {
          const box = document.createElement('div');
          box.className = 'provider-box';
          box.innerHTML = `<div class="provider-label">${r.ai_provider}</div><div class="provider-text"></div>`;
          box.querySelector('.provider-text').textContent = r.summary || r.raw_response || '(응답 없음)';
          grid.appendChild(box);
        });
      }
      wrap.appendChild(grid);
      return wrap;
    }

    function renderDetail(d) {
      if (!d) return;
      finalModel.textContent = d.llm_model_used ? `· ${d.llm_model_used} · ${d.status}` : `· ${d.status}`;
      finalBox.textContent = d.final_result || '최종 결과가 없습니다.';
      rounds.innerHTML = '';
      rounds.appendChild(roundBlock('STEP1 · 관광지 TOP20 응답 (각 AI)', d.round1, null));
      rounds.appendChild(roundBlock('STEP2 · 일정 계획 응답 (각 AI)', d.round2, d.round2_prompt));
    }

    async function run() {
      const country = el('country').value.trim();
      const region = el('region').value.trim();
      if (!country || !region) { setBusy(false, '여행 국가와 지역은 필수입니다.'); return; }
      const providers = selectedProviders();
      if (!providers.length) { setBusy(false, '비교 대상 AI를 선택하세요.'); return; }

      setBusy(true, 'STEP1 관광지 조사 → STEP2 일정 계획 → 최종 취합 중... (수십 초~수 분 소요)');
      finalBox.textContent = ''; rounds.innerHTML = '';
      try {
        const res = await fetch('/travel_compare/run', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            country, region,
            period: el('period').value.trim(),
            must_see: el('mustSee').value.trim(),
            period_notes: el('periodNotes').value.trim(),
            remarks: el('remarks').value.trim(),
            providers, llm_model: el('llmModel').value || null, user_id: 1,
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        const d = await res.json();
        renderDetail(d);
        setBusy(false, d.status === 'COMPLETED' ? '완료' : `상태: ${d.status}`);
        loadHistory();
      } catch (err) {
        console.error(err); setBusy(false, `실패: ${err.message}`);
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch('/travel_compare/history?limit=30');
        const items = await res.json();
        if (!Array.isArray(items) || !items.length) { historyList.innerHTML = '<div class="muted">이력이 없습니다.</div>'; return; }
        historyList.innerHTML = '';
        items.forEach((h) => {
          const row = document.createElement('div');
          row.className = 'history-item';
          row.innerHTML = `<div class="history-q"></div><div class="history-meta">${h.status} · ${(h.created_at||'').replace('T',' ').slice(0,16)}</div>`;
          row.querySelector('.history-q').textContent = h.user_prompt || '(질문 없음)';
          row.addEventListener('click', () => loadDetail(h.id));
          historyList.appendChild(row);
        });
      } catch (err) { historyList.innerHTML = `<div class="muted">이력 로드 실패: ${err.message}</div>`; }
    }

    async function loadDetail(id) {
      setBusy(true, '이력 불러오는 중...');
      try {
        const res = await fetch(`/travel_compare/history/${id}`);
        if (!res.ok) throw new Error(await res.text());
        renderDetail(await res.json());
        setBusy(false, '이력 조회 완료');
      } catch (err) { setBusy(false, `이력 조회 실패: ${err.message}`); }
    }

    runBtn.addEventListener('click', run);
    window.addEventListener('load', () => { el('connState').textContent = '준비됨'; loadHistory(); });
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyAI DPI · Private AI</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a26;
      --panel-2: #182234;
      --border: #223049;
      --text: #e7edf6;
      --muted: #93a1b5;
      --accent: #4f8cff;
      --accent-2: #7c5cff;
      --danger: #ff5c7a;
      --ok: #34d399;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #16223a 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 18px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand .logo {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center;
      font-weight: 800;
    }

    .brand h1 { font-size: 18px; margin: 0; }
    .brand small { color: var(--muted); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    aside .panel + .panel { margin-top: 16px; }

    h3 { margin: 0 0 12px; font-size: 15px; }
    h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(79,140,255,.14); color: #bcd3ff;
      font-size: 12px; border: 1px solid rgba(79,140,255,.3);
    }

    .provider-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; border-radius: 10px;
      border: 1px solid var(--border); margin-bottom: 8px;
      background: var(--panel-2);
    }
    .provider-item label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .provider-item .q { font-size: 11px; color: var(--muted); }

    /* Chat */
    .chat {
      display: flex; flex-direction: column;
      height: calc(100vh - 44px);
    }
    .chat-head {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px;
    }
    .chat-state { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }

    .messages {
      flex: 1; overflow-y: auto; padding-right: 6px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .msg { display: flex; gap: 10px; max-width: 88%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
    }
    .msg.user .avatar { background: #2b3752; }
    .bubble {
      background: var(--panel-2); border: 1px solid var(--border);
      padding: 12px 14px; border-radius: 14px; line-height: 1.55;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: #1c2a44; }
    .bubble.clickable { cursor: pointer; border-color: rgba(79,140,255,.45); }
    .bubble.clickable:hover { background: #1b2740; }
    .bubble .hint { display:block; margin-top:8px; font-size:11px; color: var(--accent); }

    .dpi-note {
      margin-top: 8px; font-size: 12px; color: var(--muted);
      border-top: 1px dashed var(--border); padding-top: 8px;
    }
    .dpi-note .chip {
      display:inline-block; margin: 2px 4px 2px 0; padding: 2px 8px;
      border-radius: 999px; background: rgba(255,92,122,.14);
      color:#ffb3c3; border:1px solid rgba(255,92,122,.3); font-size: 11px;
    }

    .composer {
      margin-top: 12px; display: flex; gap: 10px; align-items: flex-end;
    }
    textarea {
      flex: 1; resize: none; min-height: 54px; max-height: 160px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
      font-family: inherit; font-size: 14px;
    }
    button {
      border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer;
      font-weight: 700; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    button.secondary {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text); font-weight: 600;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .row { display: flex; gap: 8px; }
    .field { width: 100%; margin-bottom: 8px; }
    .field input, .field select {
      width: 100%; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; font-size: 13px;
    }
    .term-list { max-height: 200px; overflow-y: auto; }
    .term-row {
      display:flex; align-items:center; justify-content: space-between;
      gap: 8px; padding: 7px 9px; border:1px solid var(--border);
      border-radius: 9px; margin-bottom: 6px; background: var(--panel-2); font-size: 13px;
    }
    .term-row .meta { color: var(--muted); font-size: 11px; }
    .term-row .del { background: transparent; color: var(--danger); padding: 4px 6px; }

    /* Modal */
    .modal {
      position: fixed; inset: 0; background: rgba(4,8,15,.72);
      display: none; align-items: center; justify-content: center; padding: 24px; z-index: 50;
    }
    .modal.visible { display: flex; }
    .modal-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
      width: min(980px, 96vw); max-height: 88vh; overflow: hidden; display: flex; flex-direction: column;
    }
    .modal-head { display:flex; align-items:center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); }
    .modal-body { padding: 18px; overflow-y: auto; }
    .resp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .resp-box { border: 1px solid var(--border); border-radius: 12px; background: var(--panel-2); overflow: hidden; }
    .resp-label { padding: 10px 12px; border-bottom: 1px solid var(--border); font-weight: 700; display:flex; justify-content: space-between; align-items:center; }
    .resp-label .time { font-size: 11px; color: var(--muted); font-weight: 500; }
    .resp-text { margin: 0; padding: 12px; white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.55; }
  </style>
</head>

<body>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="logo">DPI</div>
        <div>
          <h1>MyAI · Private</h1>
          <small>보안 재작성 게이트웨이</small>
        </div>
      </div>

      <div class="panel">
        <h3>Public AI 대상</h3>
        <div id="providerList"></div>
        <span class="badge">Local LLM 재작성 후 전송</span>
      </div>

      <div class="panel">
        <h4>금지어 / 금지문장 관리</h4>
        <div class="field row">
          <select id="termType" style="max-width: 110px;">
            <option value="WORD">단어</option>
            <option value="SENTENCE">문장</option>
          </select>
          <input id="termInput" placeholder="금지어 입력" />
        </div>
        <div class="field">
          <input id="termHint" placeholder="대체 표현 힌트(선택)" />
        </div>
        <div class="row">
          <button id="addTermBtn" class="secondary" style="flex:1;">금지어 추가</button>
        </div>
        <div class="term-list" id="termList" style="margin-top:10px;"></div>
      </div>
    </aside>

    <main class="panel chat">
      <div class="chat-head">
        <div>
          <h3 style="margin:0;">Private AI 대화</h3>
          <small style="color:var(--muted);">질문은 로컬 LLM이 금지어를 우회 표현으로 재작성한 뒤 Public AI로 전송됩니다.</small>
        </div>
        <div class="chat-state"><span class="dot"></span><span id="chatStatus">연결 중</span></div>
      </div>

      <div class="messages" id="messageList">
        <div class="msg">
          <div class="avatar">AI</div>
          <div class="bubble">
            안녕하세요. 저는 MyAI Private 게이트웨이입니다. 질문을 입력하면 사내 금지어를 자동으로
            감지하여 의미는 유지하되 노출되지 않도록 재작성한 후 외부 AI에 전달합니다.
          </div>
        </div>
      </div>

      <div class="composer">
        <textarea id="questionInput" placeholder="질문을 입력하세요..."></textarea>
        <button id="sendBtn">전송</button>
      </div>
    </main>
  </div>

  <div class="modal" id="responseModal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 style="margin:0;">Public AI 응답 비교</h3>
        <button class="secondary" id="closeModalBtn" type="button">닫기</button>
      </div>
      <div class="modal-body">
        <div class="resp-grid" id="respGrid"></div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      userId: 1,
      conversationId: null,
      sendInFlight: false,
      providers: [
        { key: 'gemini', label: 'Gemini', enabled: true },
        { key: 'openai', label: 'OpenAI', enabled: true },
        { key: 'groq', label: 'Groq', enabled: true },
        { key: 'mistral', label: 'Mistral', enabled: true }
      ]
    };

    const $ = (id) => document.getElementById(id);
    const questionInput = $('questionInput');
    const sendBtn = $('sendBtn');
    const messageList = $('messageList');
    const chatStatus = $('chatStatus');
    const providerList = $('providerList');
    const responseModal = $('responseModal');
    const respGrid = $('respGrid');
    const closeModalBtn = $('closeModalBtn');
    const termList = $('termList');

    function setStatus(text) { chatStatus.textContent = text; }

    function renderProviders() {
      providerList.innerHTML = '';
      state.providers.forEach((p) => {
        const row = document.createElement('div');
        row.className = 'provider-item';
        row.innerHTML = `
          <label>
            <input type="checkbox" value="${p.key}" ${p.enabled ? 'checked' : ''} />
            <span>${p.label}</span>
          </label>
          <span class="q">public</span>`;
        providerList.appendChild(row);
      });
    }

    function getSelectedProviders() {
      return Array.from(providerList.querySelectorAll('input[type=checkbox]:checked')).map((c) => c.value);
    }

    async function loadProviderStatus() {
      try {
        const res = await fetch('/ai/providers/status');
        if (!res.ok) return;
        const data = await res.json();
        if (Array.isArray(data.providers) && data.providers.length) {
          state.providers = data.providers
            .filter((p) => p.key !== 'meta')
            .map((p) => ({ key: p.key, label: p.label, enabled: p.enabled !== false }));
        }
      } catch (e) { console.warn(e); }
      renderProviders();
    }

    async function ensureConversation() {
      if (state.conversationId) return state.conversationId;
      try {
        const listRes = await fetch('/conversations/');
        if (listRes.ok) {
          const list = await listRes.json();
          if (Array.isArray(list) && list.length) {
            state.conversationId = list[list.length - 1].id;
            return state.conversationId;
          }
        }
      } catch (e) { console.warn(e); }

      const res = await fetch('/conversations/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: 'DPI Session' })
      });
      const conv = await res.json();
      state.conversationId = conv.id;
      return state.conversationId;
    }

    function addMessage(role, text, meta) {
      const wrap = document.createElement('div');
      wrap.className = 'msg' + (role === 'user' ? ' user' : '');
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? 'ME' : 'AI';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      if (meta && Array.isArray(meta.providerResponses) && meta.providerResponses.length) {
        bubble.classList.add('clickable');
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = '클릭하면 Public AI 응답 2개를 팝업으로 확인할 수 있습니다.';
        bubble.appendChild(hint);
        bubble.addEventListener('click', () => openModal(meta.providerResponses));
      }

      if (meta && meta.dpi) {
        const note = document.createElement('div');
        note.className = 'dpi-note';
        const terms = (meta.dpi.detected_terms || []).map((t) => t.term);
        if (meta.dpi.rewrite_applied) {
          const method = meta.dpi.used_llm && !meta.dpi.fallback_used
            ? '로컬 LLM 재작성'
            : '규칙 기반 대체(LLM 재작성 실패)';
          note.innerHTML = `🔒 금지어 감지 ${terms.length}건 → ${method} 후 전송됨` +
            (terms.length ? '<br/>' + terms.map((t) => `<span class="chip">${t}</span>`).join('') : '') +
            `<br/><b>재작성된 질문:</b> ${meta.dpi.rewritten_prompt || ''}`;
          if (meta.dpi.still_contains_forbidden) {
            note.innerHTML += '<br/><b style="color:var(--danger);">⚠ 경고: 재작성 후에도 금지어가 남아 있을 수 있습니다.</b>';
          }
        } else {
          note.innerHTML = '✅ 금지어 미감지 · 원문 그대로 전송됨';
        }
        bubble.appendChild(note);
      }

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      messageList.appendChild(wrap);
      messageList.scrollTop = messageList.scrollHeight;
    }

    function openModal(providerResponses) {
      respGrid.innerHTML = '';
      if (!Array.isArray(providerResponses) || !providerResponses.length) {
        respGrid.innerHTML = '<div class="resp-box"><div class="resp-label">응답 정보</div><pre class="resp-text">저장된 Public AI 응답이 없습니다.</pre></div>';
      } else {
        providerResponses.forEach((item) => {
          const box = document.createElement('div');
          box.className = 'resp-box';
          const time = item.response_time_ms != null ? `${Math.round(item.response_time_ms)}ms` : '';
          const text = (item.summary || item.answer || '응답 내용이 비어 있습니다.')
            .replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
          box.innerHTML = `
            <div class="resp-label"><span>${item.provider || 'unknown'} · ${item.model || ''}</span><span class="time">${time}</span></div>
            <pre class="resp-text"></pre>`;
          box.querySelector('.resp-text').textContent = text;
          respGrid.appendChild(box);
        });
      }
      responseModal.classList.add('visible');
      responseModal.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      responseModal.classList.remove('visible');
      responseModal.setAttribute('aria-hidden', 'true');
    }

    async function sendQuestion() {
      const text = questionInput.value.trim();
      if (!text) { setStatus('질문을 입력해 주세요'); return; }
      if (state.sendInFlight) { setStatus('이전 질문 처리 중입니다'); return; }

      state.sendInFlight = true;
      sendBtn.disabled = true;
      questionInput.value = '';

      try {
        setStatus('로컬 LLM 재작성 및 전송 중...');
        addMessage('user', text);
        const conversationId = await ensureConversation();
        const selectedProviders = getSelectedProviders();

        const payload = {
          user_id: state.userId,
          question: text,
          conversation_id: conversationId,
          provider: selectedProviders[0] || 'gemini',
          selected_providers: selectedProviders,
          response_format_text: '답변은 아래 형식으로 정리해줘\n- 핵심 요약\n- 상세 설명\n- 결론'
        };

        const res = await fetch('/ai_dpi/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText || '전송 실패');
        }

        const data = await res.json();
        const answer = data.answer || data.summary || '응답이 비어 있습니다.';
        const providerResponses = Array.isArray(data.provider_responses) ? data.provider_responses : [];
        const dpi = data.performance && data.performance.dpi ? data.performance.dpi : null;
        addMessage('ai', answer, { providerResponses, dpi });
        setStatus('응답 완료');
      } catch (err) {
        console.error(err);
        setStatus('전송 실패');
        addMessage('ai', `오류: ${err.message}`);
      } finally {
        state.sendInFlight = false;
        sendBtn.disabled = false;
        questionInput.focus();
      }
    }

    // ----- 금지어 관리 -----
    async function loadTerms() {
      try {
        const res = await fetch('/forbidden-terms/');
        if (!res.ok) return;
        const terms = await res.json();
        renderTerms(terms);
      } catch (e) { console.warn(e); }
    }

    function renderTerms(terms) {
      termList.innerHTML = '';
      if (!Array.isArray(terms) || !terms.length) {
        termList.innerHTML = '<div class="meta" style="color:var(--muted);font-size:12px;">등록된 금지어가 없습니다.</div>';
        return;
      }
      terms.forEach((t) => {
        const row = document.createElement('div');
        row.className = 'term-row';
        const label = t.term_type === 'SENTENCE' ? '문장' : '단어';
        row.innerHTML = `
          <div>
            <div>${t.term}</div>
            <div class="meta">${label}${t.replacement_hint ? ' · 힌트: ' + t.replacement_hint : ''}${t.is_active ? '' : ' · 비활성'}</div>
          </div>
          <button class="del" data-id="${t.id}">삭제</button>`;
        row.querySelector('.del').addEventListener('click', () => deleteTerm(t.id));
        termList.appendChild(row);
      });
    }

    async function addTerm() {
      const term = $('termInput').value.trim();
      const term_type = $('termType').value;
      const replacement_hint = $('termHint').value.trim() || null;
      if (!term) { setStatus('금지어를 입력해 주세요'); return; }

      try {
        const res = await fetch('/forbidden-terms/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ term, term_type, replacement_hint })
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText || '추가 실패');
        }
        $('termInput').value = '';
        $('termHint').value = '';
        await loadTerms();
        setStatus('금지어가 추가되었습니다');
      } catch (err) {
        setStatus('금지어 추가 실패: ' + err.message);
      }
    }

    async function deleteTerm(id) {
      try {
        const res = await fetch(`/forbidden-terms/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('삭제 실패');
        await loadTerms();
        setStatus('금지어가 삭제되었습니다');
      } catch (err) {
        setStatus('삭제 실패: ' + err.message);
      }
    }

    // ----- 이벤트 -----
    sendBtn.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
    });
    $('addTermBtn').addEventListener('click', addTerm);
    closeModalBtn.addEventListener('click', closeModal);
    responseModal.addEventListener('click', (e) => { if (e.target === responseModal) closeModal(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && responseModal.classList.contains('visible')) closeModal();
    });

    window.addEventListener('load', async () => {
      try {
        await loadProviderStatus();
        await ensureConversation();
        await loadTerms();
        setStatus('Private AI 연결 완료');
      } catch (e) {
        console.error(e);
        setStatus('연결 실패');
      }
    });
  </script>
</body>

</html>
